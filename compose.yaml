services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dishpute}
      POSTGRES_USER: ${POSTGRES_USER:-dishpute}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dishpute-local-only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - dishpute_postgres_data:/var/lib/postgresql/data

volumes:
  dishpute_postgres_data:

